spring:
  datasource:
    # The default points at the dedicated stack in compose.test.yaml, never at a development
    # database. Integration tests install failure-injection triggers, so the target must be
    # disposable and must not be shared with anything else.
    url: ${JDBC_URL:jdbc:postgresql://127.0.0.1:55433/decisionrail_test}
    username: ${JDBC_USERNAME:decisionrail}
    password: ${JDBC_PASSWORD:local-test-only}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
app:
  demo-enabled: false
  events:
    # Tests drive the dispatcher one deterministic cycle at a time instead of racing a timer.
    fault-injection-enabled: true
    dispatcher:
      enabled: false
      send-timeout: 3s
      lease-duration: 10s
      max-attempts: 3
      backoff-base: 50ms
      backoff-ceiling: 200ms
    breaker:
      failure-threshold: 2
      open-duration: 1s
  merchant-demo-password: demo-test-password-123
  merchant-other-password: other-test-password-123
  operations-password: operations-test-password-123
  admin-password: admin-test-password-123
