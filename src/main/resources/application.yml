spring:
  application:
    name: decisionrail
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/decisionrail}
    username: ${JDBC_USERNAME:decisionrail}
    password: ${JDBC_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
      connection-init-sql: "SET lock_timeout = '5s'"
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind the deployment's reverse proxy the application must learn the client's scheme and address
  # from X-Forwarded-* headers, so that Secure cookies, redirects and the authentication limiter see
  # the real request. Off by default: on the loopback development stack there is no proxy, and a
  # forwarded header from an arbitrary client must not be believed. The deployment sets `framework`,
  # and its proxy is the only thing able to reach this port.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      # The browser session cookie. HttpOnly so page script cannot read it, SameSite=Lax so another
      # site cannot drive a state-changing request with it while ordinary navigation into the
      # dashboard still works.
      cookie:
        http-only: true
        same-site: lax
        # Must be true wherever the dashboard is served over HTTPS. It defaults to false only because
        # the documented local stack is loopback HTTP, where a Secure cookie would never be sent and
        # sign-in would be impossible. This is the one deliberate local exception.
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: ${SESSION_TIMEOUT:30m}
logging:
  structured:
    format:
      # One JSON object per line, in a documented schema, enabled by setting LOG_FORMAT=ecs. It stays
      # off by default because a developer reading a terminal is better served by the plain encoder,
      # and the container profile turns it on. Trace and span ids reach these records through MDC,
      # which is how a log line and a span find each other without either knowing about the other.
      console: ${LOG_FORMAT:}
  # Correlation fields are emitted by the structured encoder from MDC; this pattern is what the
  # plain console format uses so the same identifiers are visible when JSON is off.
  pattern:
    correlation: "[${spring.application.name:decisionrail},%X{traceId:-},%X{spanId:-},%X{requestId:-}] "
  include-application-name: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      # Liveness answers "is this process alive". Readiness answers "should traffic for the
      # synchronous payment API arrive here", so it includes the database: a payment command
      # cannot succeed without it. Broker reachability is deliberately absent from both,
      # because payments keep working while the broker is down. Degraded asynchronous
      # capability is reported separately by the async group so an outage is visible without
      # taking a healthy payment API out of rotation.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        async:
          include: asyncDelivery
          show-details: always
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        # A non-empty http-mapping REPLACES Spring Boot's defaults rather than adding to them, so
        # every unhealthy status has to be listed here. Declaring only DEGRADED previously made
        # DOWN and OUT_OF_SERVICE fall back to 200, which meant a readiness probe answered with a
        # success code while the database was unreachable. Do not remove these two entries.
        http-mapping:
          DOWN: 503
          OUT_OF_SERVICE: 503
          # DEGRADED stays 200: impaired asynchronous delivery is a real operational signal, but
          # it must not read as an unhealthy instance, because the payment API is still correct.
          DEGRADED: 200
  metrics:
    tags:
      # Identifies the series when more than one instance or environment writes to one backend.
      application: decisionrail
    distribution:
      # Percentiles are computed in the backend from these buckets, not in the application. A
      # client-side percentile cannot be aggregated across instances or re-windowed afterwards,
      # and this project publishes percentiles, so the raw buckets are what must be exported.
      percentiles-histogram:
        http.server.requests: true
      # Latency outside these bounds still counts; the bounds only decide bucket resolution.
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
  tracing:
    sampling:
      # Every request is sampled by default. This is a synthetic single-instance system where the
      # point of tracing is to follow one specific payment end to end; sampling it away defeats
      # that. Lower it for a load run by setting MANAGEMENT_TRACING_SAMPLING_PROBABILITY, and note
      # that the sampling decision is taken once at the request and honoured by every later hop.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      export:
        # Off unless deliberately enabled. Spans are still created and their ids still reach every
        # log record, so a payment can be correlated with no collector running at all; exporting only
        # decides whether they also leave the process. An empty endpoint is not a way to disable it:
        # the exporter rejects one at startup, which would make telemetry able to stop the
        # application from booting.
        enabled: ${OTLP_EXPORT_ENABLED:false}
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      # Bounded on purpose: a collector that stops reading must not consume the application's memory
      # or block a payment thread waiting for an export.
      timeout: 3s
app:
  demo-enabled: ${DEMO_ENABLED:false}
  ui:
    # Applies the same rule to the CSRF cookie as to the session cookie above.
    secure-cookies: ${SESSION_COOKIE_SECURE:false}
  events:
    topic: ${EVENTS_TOPIC:decisionrail.payments.v1}
    projection-group: ${EVENTS_PROJECTION_GROUP:decisionrail-projection}
    shadow-group: ${EVENTS_SHADOW_GROUP:decisionrail-shadow}
    # Typed local failpoints for delivery and shadow tests. Never enable outside local or test.
    fault-injection-enabled: ${EVENTS_FAULT_INJECTION_ENABLED:false}
    dispatcher:
      enabled: ${EVENTS_DISPATCHER_ENABLED:true}
      batch-size: 64
      poll-interval: 250ms
      lease-duration: 30s
      max-attempts: 8
      send-timeout: 5s
      backoff-base: 200ms
      backoff-ceiling: 30s
      backoff-multiplier: 2.0
      send-concurrency: 4
    breaker:
      failure-threshold: 5
      open-duration: 10s
      probe-successes-to-close: 1
    backlog:
      degraded-age: 120s
      degraded-count: 1000
  replay:
    enabled: ${REPLAY_ENABLED:true}
    batch-size: 100
    poll-interval: 500ms
    lease-duration: 60s
  shadow:
    # Enables the background worker, not shadow evaluation itself. Whether a candidate is
    # evaluated is operator state in the database, set through PUT /v1/ops/shadow.
    enabled: ${SHADOW_WORKER_ENABLED:true}
    batch-size: 50
    concurrency: 2
    max-attempts: 3
    poll-interval: 500ms
    lease-duration: 30s
    retry-delay: 1s
  merchant-demo-password: ${MERCHANT_DEMO_PASSWORD}
  merchant-other-password: ${MERCHANT_OTHER_PASSWORD}
  operations-password: ${OPERATIONS_PASSWORD}
  admin-password: ${ADMIN_PASSWORD}
  build:
    # Stamped by the image build and the deployment; reported by GET /actuator/info and nowhere else.
    commit: ${APP_COMMIT:}
    image: ${APP_IMAGE:}
    built-at: ${APP_BUILT_AT:}
  public-demo:
    # The publicly reachable portfolio instance. Off everywhere except that deployment. Turning it on
    # adds the shared visitor identity, applies the budgets below to that identity on both API chains,
    # limits failed authentication attempts per client address, and makes the async health details an
    # operator read. It also refuses to start with fault injection enabled or without Secure cookies.
    enabled: ${PUBLIC_DEMO_ENABLED:false}
    visitor-username: ${VISITOR_USERNAME:visitor}
    visitor-password: ${VISITOR_PASSWORD:}
    commands-per-minute: ${DEMO_COMMANDS_PER_MINUTE:30}
    replay-jobs-per-hour: ${DEMO_REPLAY_JOBS_PER_HOUR:6}
    max-running-replay-jobs: ${DEMO_MAX_RUNNING_REPLAY_JOBS:1}
    reconciliation-per-minute: ${DEMO_RECONCILIATION_PER_MINUTE:10}
    max-payments-per-account: ${DEMO_MAX_PAYMENTS_PER_ACCOUNT:300}
    auth-failures-per-window: ${DEMO_AUTH_FAILURES_PER_WINDOW:10}
    auth-failure-window: ${DEMO_AUTH_FAILURE_WINDOW:15m}
