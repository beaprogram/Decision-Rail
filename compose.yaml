name: decisionrail
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: decisionrail
      POSTGRES_USER: decisionrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/prepare-local-env.sh first}
    ports:
      # Host ports are overridable so this stack can coexist with another local PostgreSQL.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionrail -d decisionrail"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Single-node KRaft broker for local development: one controller, one broker, replication
  # factor 1. It is deliberately NOT a highly available deployment. There is no second replica,
  # so a broker restart is a delivery outage and a lost volume is lost events. The outbox is
  # what makes that survivable: committed intent stays in PostgreSQL until a broker
  # acknowledges it. A real deployment would need at least three brokers, replication factor 3,
  # and min.insync.replicas 2 before any durability claim could be made.
  broker:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  backend:
    build: .
    environment:
      JDBC_URL: jdbc:postgresql://database:5432/decisionrail
      JDBC_USERNAME: decisionrail
      JDBC_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/prepare-local-env.sh first}
      MERCHANT_DEMO_PASSWORD: ${MERCHANT_DEMO_PASSWORD:?Run scripts/prepare-local-env.sh first}
      MERCHANT_OTHER_PASSWORD: ${MERCHANT_OTHER_PASSWORD:?Run scripts/prepare-local-env.sh first}
      OPERATIONS_PASSWORD: ${OPERATIONS_PASSWORD:?Run scripts/prepare-local-env.sh first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/prepare-local-env.sh first}
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      DEMO_ENABLED: "true"
      PORT: "8080"
    depends_on:
      database:
        condition: service_healthy
      # The backend starts even if the broker is unhealthy later; this only orders startup.
      broker:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
