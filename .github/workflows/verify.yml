name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostgreSQL and Kafka come from compose.test.yaml rather than workflow service
    # containers, so CI runs the same infrastructure definition the documented local
    # workflow uses. Infrastructure behaviour is never skipped: if either dependency is
    # unavailable the suite fails.
    env:
      JDBC_URL: jdbc:postgresql://127.0.0.1:55433/decisionrail_test
      JDBC_USERNAME: decisionrail
      JDBC_PASSWORD: local-test-only
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19092
      MERCHANT_DEMO_PASSWORD: ci-demo-merchant-ephemeral-only
      MERCHANT_OTHER_PASSWORD: ci-other-merchant-ephemeral-only
      OPERATIONS_PASSWORD: ci-operations-ephemeral-only
      ADMIN_PASSWORD: ci-administrator-ephemeral-only
      DEMO_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties
      # Node is installed here for the browser tests only. The Maven build downloads and pins its own
      # Node for compiling the dashboard, so the bundle in the jar does not depend on this one.
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start dedicated PostgreSQL and Kafka
        run: docker compose -f compose.test.yaml up -d --wait --wait-timeout 240
      - name: Compile, test, and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Build application container
        run: docker build --tag decisionrail:ci .
      - name: Run application container and both operator demos
        shell: bash
        run: |
          docker run --detach --name decisionrail-smoke --network host \
            --env JDBC_URL --env JDBC_USERNAME --env JDBC_PASSWORD \
            --env MERCHANT_DEMO_PASSWORD --env MERCHANT_OTHER_PASSWORD \
            --env OPERATIONS_PASSWORD --env ADMIN_PASSWORD \
            --env KAFKA_BOOTSTRAP_SERVERS --env DEMO_ENABLED --env PORT=8080 \
            decisionrail:ci
          deadline=$((SECONDS + 60))
          until curl --fail --silent --max-time 2 http://localhost:8080/actuator/health > /dev/null; do
            if (( SECONDS >= deadline )); then
              printf 'Application container did not become healthy within 60 seconds.\n' >&2
              exit 1
            fi
            sleep 2
          done
          ./scripts/demo.sh
          COMPOSE_FILE_PATH=compose.test.yaml BROKER_SERVICE=test-broker \
            DATABASE_SERVICE=test-database DATABASE_NAME=decisionrail_test \
            ADMIN_PASSWORD="$ADMIN_PASSWORD" ./scripts/async-demo.sh
      # Browser verification runs against that same packaged container and the same real PostgreSQL
      # and Kafka. It is not a smoke test with mocked responses: it signs in, authorizes, captures,
      # replays a candidate policy, and stops the broker to see delivery degrade.
      - name: Install browser
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser end-to-end tests
        working-directory: frontend
        env:
          DASHBOARD_BASE_URL: http://localhost:8080
          COMPOSE_FILE_PATH: ../compose.test.yaml
          BROKER_SERVICE: test-broker
          DATABASE_SERVICE: test-database
          DATABASE_NAME: decisionrail_test
        # No --retries override on purpose: playwright.config.ts pins retries to 0, so a first-attempt
        # failure fails the build here exactly as it would locally. Do not add retries to settle a flaky
        # test; fix the test or the application.
        run: npx playwright test
      # A few seconds of load against the benchmark's own isolated stack. This checks that the harness
      # executes and that its post-run correctness checks pass; it is deliberately NOT a benchmark. A
      # shared runner with unknown neighbours cannot produce a latency figure worth quoting, and none
      # is published from here. It runs after the browser suite so it never shares infrastructure with
      # the fault-injection tests.
      - name: Smoke-run the performance harness
        env:
          BENCH_PORT: "8082"
          WARMUP: 3s
          ACCOUNT_COUNT: "4"
        run: ./benchmark/run.sh spread 5 10s ci
      - name: Show benchmark logs on failure
        if: failure()
        run: tail -n 200 benchmark/results/app-*.log || true

      - name: Show container logs on failure
        if: failure()
        run: |
          if docker inspect decisionrail-smoke > /dev/null 2>&1; then
            docker logs decisionrail-smoke
          fi
      - name: Show broker and database logs on failure
        if: failure()
        run: docker compose -f compose.test.yaml logs --tail 100 || true
      - name: Remove smoke container
        if: always()
        run: docker rm --force decisionrail-smoke > /dev/null 2>&1 || true
      - name: Stop dedicated infrastructure
        if: always()
        run: docker compose -f compose.test.yaml down -v || true
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
      # Kept only for a failure, and only briefly: a browser trace can contain session cookies and
      # tenant data, so it is never committed and not retained longer than it takes to diagnose.
      - name: Save browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 3
