name: Release image
# Builds the application image for the public deployment and publishes it to GitHub's container
# registry, which is free for a public repository's packages.
#
# It runs only for a version tag or by hand. It never runs on every push: the image that reaches
# the demo host is one someone chose to release, and its tag names the commit it was built from so
# GET /actuator/info on the running instance can be matched back here. Nothing is deployed by this
# workflow - deploying is the operator's action on the host, documented in deploy/README.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      # The host this targets is an Ampere (arm64) VM; a local rehearsal is whatever the operator
      # runs. Both are built from one Dockerfile in one job so they cannot drift.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/decision-rail
          # sha-<commit> is the tag deployments pin; the version tag is the human name for it.
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=DecisionRail
            org.opencontainers.image.description=Synthetic payment decisioning. No real money.

      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_IMAGE=ghcr.io/${{ github.repository_owner }}/decision-rail:sha-${{ github.sha }}
            APP_BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record what was published
        run: |
          {
            echo "## Published"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pin a deployment to the \`sha-\` tag; \`GET /actuator/info\` on the running instance reports the same commit."
          } >> "$GITHUB_STEP_SUMMARY"
