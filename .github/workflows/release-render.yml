name: Release Render image
# Explicit owner dispatch only; never replaces the reviewed standalone application's tags.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: release-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: stamp
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: render
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/decision-rail:render-sha-${{ github.sha }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_IMAGE=ghcr.io/${{ github.repository_owner }}/decision-rail:render-sha-${{ github.sha }}
            APP_BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=gha,scope=render
          cache-to: type=gha,scope=render,mode=max
      - name: Record publication boundary
        run: |
          {
            echo '## Render image published; nothing deployed'
            echo 'Image: `ghcr.io/${{ github.repository_owner }}/decision-rail:render-sha-${{ github.sha }}`'
            echo 'Check package visibility, anonymous pull, both architecture manifests and the running commit before use.'
            echo 'Live Render/Aiven acceptance remains required; see deploy/render/README.md.'
          } >> "$GITHUB_STEP_SUMMARY"
